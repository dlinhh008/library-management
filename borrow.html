<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mượn / Trả sách</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="books.html">Quản lý Sách</a>
            <a href="readers.html">Quản lý Độc giả</a>
            <a href="borrow.html" class="active">Mượn / Trả sách</a>
        </nav>

        <div class="page-header">
            <h2>Quản lý Mượn / Trả & Phạt</h2>
            <button class="btn btn-add" onclick="document.getElementById('borrowModal').style.display='block'">+ Tạo phiếu mượn</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mã phiếu</th>
                    <th>Người mượn</th>
                    <th>Tên sách</th>
                    <th>Hạn trả</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="borrowTableBody"></tbody>
        </table>
    </div>

    <!-- Modal Mượn sách -->
    <div id="borrowModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Tạo phiếu mượn mới</h3>
            <form id="borrowForm">
                <div class="form-group">
                    <label>Mã phiếu mượn</label>
                    <input type="text" id="borrowId" required>
                </div>
                <div class="form-group">
                    <label>Tên người mượn</label>
                    <input type="text" id="readerName" required>
                </div>
                <div class="form-group">
                    <label>Tên sách mượn</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label>Ngày hẹn trả</label>
                    <input type="date" id="dueDate" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Xác nhận</button>
                    <button type="button" class="btn btn-edit" onclick="document.getElementById('borrowModal').style.display='none'">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Phiếu Phạt -->
    <div id="penaltyModal" class="modal-overlay">
        <div class="modal-card" style="border-color: rgba(251, 113, 133, 0.4);">
            <h3 style="color: #fb7185;">PHIẾU PHẠT QUÁ HẠN</h3>
            <p style="margin-bottom: 8px; color: var(--text-secondary);">Mã mượn: <strong id="penaltyBorrowId" style="color: #fff;"></strong></p>
            <p style="margin-bottom: 8px; color: var(--text-secondary);">Độc giả: <strong id="penaltyReader" style="color: #fff;"></strong></p>
            <p style="margin-bottom: 8px; color: var(--text-secondary);">Hạn trả: <strong id="penaltyDueDate" style="color: #fff;"></strong></p>
            <p style="margin-bottom: 8px; color: var(--text-secondary);">Quá hạn: <strong id="penaltyDays" style="color: #fbbf24;"></strong> ngày</p>
            <p style="margin: 16px 0; font-size: 18px; color: var(--text-secondary);">Tiền phạt: <span id="penaltyAmount" style="color: #fb7185; font-weight: 700; font-size: 22px;"></span> VNĐ</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-edit" style="width: 100%;" onclick="document.getElementById('penaltyModal').style.display='none'">Đóng</button>
            </div>
        </div>
    </div>

    <script src="js/borrow.js"></script>
</body>
</html>
