<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Độc giả</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="books.html">Quản lý Sách</a>
            <a href="readers.html" class="active">Quản lý Độc giả</a>
            <a href="borrow.html">Mượn / Trả sách</a>
        </nav>

        <div class="page-header">
            <h2>Danh mục Quản lý Độc giả</h2>
            <button class="btn btn-add" onclick="openReaderForm()">+ Thêm độc giả</button>
        </div>

        <div class="controls-bar">
            <input type="text" id="searchReader" class="search-input" placeholder="Tìm theo mã hoặc tên độc giả..." onkeyup="searchReaders()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mã thẻ</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="readerTable"></tbody>
        </table>
    </div>

    <!-- Modal Thêm/Sửa Độc giả -->
    <div id="readerModal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="readerFormTitle">Thông Tin Độc Giả</h3>
            <form id="readerForm" onsubmit="event.preventDefault(); saveReader();">
                <div class="form-group">
                    <label>Mã độc giả</label>
                    <input type="text" id="readerId" required>
                </div>
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="readerName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="readerEmail" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="readerPhone" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <button type="button" class="btn btn-edit" onclick="closeReaderForm()">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/readers.js"></script>
</body>
</html>
